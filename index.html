<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BrokeNoMore | Student Finance</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap">
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <header class="topbar">
    <h1 class="logo">BrokeNoMore<span>.</span></h1>
    <nav>
      <a href="#dashboard" class="active">Dashboard</a>
      <a href="#transactions">Transactions</a>
      <a href="#budget">Budget</a>
    </nav>
    <div class="avatar">S</div>
  </header>

  <main class="container" id="dashboard">

    <section class="welcome">
      <div>
        <h2>Hey, Student </h2>
        <p>Here’s your money snapshot for this month.</p>
      </div>
      <select id="month" aria-label="Choose month"></select>
    </section>

    <section class="cards">
      <div class="card balance"><p>Balance</p><h3 id="balance">₹0</h3></div>
      <div class="card income"><p>Income</p><h3 id="income">₹0</h3></div>
      <div class="card expense"><p>Expenses</p><h3 id="expenses">₹0</h3></div>
    </section>

    <section class="grid">

      <article class="panel" id="budget">
        <h3>Monthly Budget</h3>
        <p class="budget-line"><strong id="spent">₹0</strong> / <span id="budgetAmt">₹0</span></p>
        <div class="bar"><div id="bar"></div></div>
        <p class="muted" id="pct"></p>
        <button class="ghost" id="setBudget">Set Budget</button>
      </article>

      

      <article class="panel" id="transactions">
        <div class="panel-head">
          <h3>Recent Transactions</h3>
          <button class="link" id="viewAll">View All</button>
        </div>
        <p class="muted" id="empty">No transactions yet. Add your first one!</p>
        <ul class="tx-list" id="list"></ul>
      </article>

      <article class="panel">
        <h3>Quick Add</h3>
        <form id="addForm">
          <div class="toggle">
            <button type="button" class="active" data-type="expense">Expense</button>
            <button type="button" data-type="income">Income</button>
          </div>
          <label for="amount">Amount (₹)</label>
          <input id="amount" type="number" min="1" placeholder="100">
          <label for="category">Category</label>
          <select id="category"></select>
          <label for="desc">Description</label>
          <input id="desc" type="text" maxlength="30" placeholder="e.g. Coffee">
          <p class="error" id="error"></p>
          <button type="submit" class="primary">Add Transaction</button>
        </form>
      </article>

    </section>
  </main>

  <script src="script.js"></script>
</body>
</html>
